name: Build And Push HA App Image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7

    steps:
      - name: Checkout HA app repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/spasemice/mqtt2ir.git#main
          file: Dockerfile.ha-app
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/spasemice/mqtt2ir-ha-app:${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}

  manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ghcr.io/spasemice/mqtt2ir-ha-app:latest \
            ghcr.io/spasemice/mqtt2ir-ha-app:amd64 \
            ghcr.io/spasemice/mqtt2ir-ha-app:aarch64 \
            ghcr.io/spasemice/mqtt2ir-ha-app:armv7
