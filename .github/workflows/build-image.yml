name: Build And Push HA App Image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  ADDON_VERSION: 1.0.0-beta.8

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7

    steps:
      - name: Checkout HA app repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/spasemice/mqtt2ir.git#main
          file: Dockerfile.ha-app
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/spasemice/mqtt2ir-ha-app/${{ matrix.arch }}:latest
            ghcr.io/spasemice/mqtt2ir-ha-app/${{ matrix.arch }}:${{ env.ADDON_VERSION }}
          build-args: |
            APP_VERSION=${{ env.ADDON_VERSION }}
